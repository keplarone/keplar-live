<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <!-- Original procedural clouds for the static sky. Not a stock photograph. -->
  <defs>
    <filter id="c" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="4" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="28" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#f7f9fb"/>
      <stop offset="1" stop-color="#c5d0dc"/>
    </linearGradient>
    <mask id="sides">
      <rect width="1440" height="900" fill="white"/>
      <rect x="360" y="40" width="720" height="620" rx="80" fill="black"/>
    </mask>
  </defs>
  <g filter="url(#c)" mask="url(#sides)">
    <ellipse cx="20" cy="560" rx="340" ry="190" fill="url(#lit)"/>
    <ellipse cx="40" cy="780" rx="300" ry="150" fill="#ffffff"/>
    <ellipse cx="1420" cy="640" rx="360" ry="200" fill="url(#lit)"/>
    <ellipse cx="1380" cy="820" rx="280" ry="140" fill="#f4f7fb"/>
  </g>
</svg>
