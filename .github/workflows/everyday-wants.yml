name: Everyday Wants
on:
  pull_request:
    paths:
      - 'src/lib/wants/**'
      - 'src/components/wants/**'
      - 'src/components/app-ui/ToolUses.tsx'
      - 'tests/wants*.test.ts'
      - '.github/workflows/everyday-wants.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/wants/**'
      - 'src/components/wants/**'
      - 'src/components/app-ui/ToolUses.tsx'
      - 'tests/wants*.test.ts'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node --import tsx --test tests/wants*.test.ts tests/mcp-chat*.test.ts
