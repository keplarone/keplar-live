name: ChatGPT integration
on:
  pull_request:
    paths:
      - 'src/lib/chatgpt/**'
      - 'src/app/api/chatgpt/**'
      - 'src/app/.well-known/**'
      - 'src/lib/security/origin.ts'
      - 'src/lib/privacy/account-data.ts'
      - 'src/proxy.ts'
      - 'tests/chatgpt*.test.ts'
      - '.github/workflows/chatgpt-integration.yml'
  push:
    branches: [main]
    paths:
      - 'src/lib/chatgpt/**'
      - 'src/app/api/chatgpt/**'
      - 'src/app/.well-known/**'
      - 'tests/chatgpt*.test.ts'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node --import tsx --test tests/chatgpt*.test.ts
