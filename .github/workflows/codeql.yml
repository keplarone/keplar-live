# Static application security testing (SAST): GitHub CodeQL over the TypeScript/JavaScript in this repository, on every pull
# request, every push to main and once a week (new queries find old bugs). Findings land in the repository's Security tab.
# Least privilege: read the code, write security events only.
name: CodeQL
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
