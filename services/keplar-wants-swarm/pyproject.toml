[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "keplar-wants-swarm"
version = "0.1.0"
description = "Keplar Wants swarm service: deterministic intent tracks, a 100,000-profile virtual expert registry and contained execution."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "pydantic==2.10.4",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-asyncio==0.25.0"]

[tool.setuptools.packages.find]
where = ["src"]
